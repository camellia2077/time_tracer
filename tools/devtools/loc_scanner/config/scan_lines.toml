# over_inclusive = true：判定逻辑为 大于等于 >=
# over_inclusive = false：判定逻辑为 严格大于 >

[test_classification]
# 组件根目录内，命中以下目录名的代码文件会单独归入 tests 类别。
directory_names = ["test", "tests", "androidTest", "testFixtures"]
# 数字越小优先级越高；tests 默认放到最低优先级。
priority = 3

[components.tracer_core]
display_name = "libs/tracer_core"
root = "libs/tracer_core"
category = "libs"
priority = 0

[components.tracer_adapters_io]
display_name = "libs/tracer_adapters_io"
root = "libs/tracer_adapters_io"
category = "libs"
priority = 1

[components.tracer_core_bridge_common]
display_name = "libs/tracer_core_bridge_common"
root = "libs/tracer_core_bridge_common"
category = "libs"
priority = 1

[components.tracer_transport]
display_name = "libs/tracer_transport"
root = "libs/tracer_transport"
category = "libs"
priority = 1

[components.tracer_core_shell]
display_name = "apps/tracer_core_shell"
root = "apps/tracer_core_shell"
category = "presentation"
priority = 2

[components.android]
display_name = "apps/android"
root = "apps/android"
category = "presentation"
priority = 2

[components.windows_cli]
display_name = "apps/cli"
root = "apps/cli"
category = "presentation"
priority = 2

[components.server]
display_name = "apps/server"
root = "apps/server"
category = "presentation"
priority = 2

[components.shared_tests]
display_name = "test"
root = "test"
category = "tests"
priority = 3

[components.tool_tests]
display_name = "tools/tests"
root = "tools/tests"
category = "tests"
priority = 3

[components.loc_scanner]
display_name = "tools/devtools/loc_scanner"
root = "tools/devtools/loc_scanner"
