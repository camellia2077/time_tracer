[profiles.workspace]
display_name = "Core Family + Presentation"
components = [
  "tracer_core",
  "tracer_adapters_io",
  "tracer_core_bridge_common",
  "tracer_transport",
  "tracer_core_shell",
  "android",
  "windows_cli",
