[[command_groups]]
name = "Generate Logs"
stage = "generate"
name_template = "Generate ({start}-{end}, items={items}, nosleep)"
template = [
  "--start",
  "{start}",
  "--end",
  "{end}",
  "--items",
  "{items}",
  "{nosleep_flag}",
  "--output",
  "{output_dir}/log_generator_output"
]
matrix = { start = [2021], end = [2027], items = [8], nosleep_flag = ["--nosleep"] }
expect_exit = 0
expect_files = [
  "{output_dir}/log_generator_output/{start}/{start}-01.txt",
  "{output_dir}/log_generator_output/{end}/{end}-12.txt"
]
expect_file_contains = [
  "{output_dir}/log_generator_output/{start}/{start}-01.txt::m01",
  "{output_dir}/log_generator_output/{end}/{end}-12.txt::m12"
]
expect_stdout_contains = ["Output Directory:"]

[[command_groups]]
name = "Generate Interval Logs"
stage = "generate"
name_template = "Generate interval ({start}-{end}, items={items}, nosleep)"
template = [
  "--start",
  "{start}",
  "--end",
  "{end}",
  "--items",
  "{items}",
  "--event-style",
  "interval",
  "{nosleep_flag}",
  "--output",
  "{output_dir}/log_generator_output_interval"
]
matrix = { start = [2021], end = [2027], items = [8], nosleep_flag = ["--nosleep"] }
expect_exit = 0
expect_files = [
  "{output_dir}/log_generator_output_interval/{start}/{start}-01.txt",
  "{output_dir}/log_generator_output_interval/{end}/{end}-12.txt"
]
expect_file_contains = [
  "{output_dir}/log_generator_output_interval/{start}/{start}-01.txt::-",
  "{output_dir}/log_generator_output_interval/{end}/{end}-12.txt::-"
]

[[commands]]
name = "Reject Mixed Event Style"
stage = "generate"
args = [
  "--year",
  "2025",
  "--event-style",
  "mixed",
  "--output",
  "{output_dir}/mixed_not_implemented"
]
expect_exit = 2
expect_stderr_contains = ["not implemented yet"]
