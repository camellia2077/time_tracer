[[commands]]
name = "Android Config Bundle Exists"
stage = "base-config"
args = [
  "/c",
  "if exist ..\\..\\..\\..\\config\\program\\meta\\bundle.toml (exit /b 0) else (echo Missing canonical config bundle.toml && exit /b 1)"
]
expect_exit = 0

[[commands]]
name = "Android Config Uses Android Profile"
stage = "base-config"
args = [
  "/c",
  "findstr /c:profile ..\\..\\..\\..\\config\\program\\meta\\bundle.toml | findstr /c:shared >nul && exit /b 0 || (echo Missing profile=shared in canonical bundle.toml && exit /b 1)"
]
expect_exit = 0

[[commands]]
name = "Android Config Uses Canonical Source Root"
stage = "base-config"
args = [
  "/c",
  "findstr /c:program/ ..\\..\\..\\..\\config\\program\\meta\\bundle.toml >nul && exit /b 0 || (echo Missing program file list in canonical bundle.toml && exit /b 1)"
]
expect_exit = 0

[[commands]]
name = "Android TXT Month Header Parser Uses mMM"
stage = "base-config"
args = [
  "/c",
  "findstr /c:monthRegex ..\\..\\..\\..\\apps\\android\\contract\\src\\main\\java\\com\\example\\tracer\\TxtMonthHeader.kt | findstr /c:m(\\\\d >nul && exit /b 0 || (echo Missing shared monthRegex parser in TxtMonthHeader.kt && exit /b 1)"
]
expect_exit = 0

[[commands]]
name = "Android New Month File Writes mMM Header In Persistence"
stage = "base-config"
args = [
  "/c",
  "findstr /c:\"m%02d\" ..\\..\\..\\..\\apps\\android\\runtime\\src\\main\\java\\com\\example\\tracer\\runtime\\LiveRawRecordPersistence.kt >nul && exit /b 0 || (echo Missing mMM header write in LiveRawRecordPersistence.kt && exit /b 1)"
]
expect_exit = 0

