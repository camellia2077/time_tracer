args = [
  "--db",
  "{output_dir}/txt_authoring/append.sqlite3",
  "pipeline",
  "ingest",
  "{output_dir}/txt_authoring_input",
  "--no-date-check",
]
expect_exit = 0
expect_files = ["{output_dir}/txt_authoring/append.sqlite3"]

[[commands]]
name = "TXT Append Query Data Search Point Remark"
stage = "txt-authoring"
args = [
  "query",
  "data",
  "search",
  "--remark",
  "cli point",
  "--db",
  "{output_dir}/txt_authoring/append.sqlite3",
]
expect_exit = 0
expect_stdout_contains = ["2025-01-02", "Total: 1"]

[[commands]]
name = "TXT Append Insights Render Day"
