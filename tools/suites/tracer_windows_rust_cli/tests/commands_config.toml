# Config capability command tests

[[commands]]
name = "Doctor Runtime Config"
stage = "config"
args = ["system", "doctor"]
expect_exit = 0
expect_stdout_contains = [
  "Runtime Doctor",
  "config_toml ->",
  "converter_alias_mapping ->",
  "Summary: required 4/4 passed.",
]

[[commands]]
name = "Chart Heatmap Palette Config Loads"
stage = "config"
args = ["report", "chart", "--list-heatmap-palettes"]
expect_exit = 0
expect_stdout_contains = [
  "Heatmap palettes",
]

[[commands]]
name = "Activity Hierarchy Commands Are Exposed"
stage = "config"
args = ["alias", "--help"]
expect_exit = 0
expect_stdout_contains = [
  "create",
  "promote",
  "add",
  "move",
  "move-config",
  "tree",
  "rename-group-alias",
  "add-group-alias",
]

[[commands]]
name = "Activity Merge Command Is Exposed"
stage = "config"
args = ["activity", "--help"]
expect_exit = 0
expect_stdout_contains = [
  "merge",
]
