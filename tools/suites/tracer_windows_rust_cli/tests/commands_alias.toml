# Alias hierarchy commands run last because they intentionally edit the
# workspace-local runtime configuration copied for this executable suite.

[[commands]]
name = "Alias Add Uses Core Hierarchy Operation"
stage = "alias"
args = ["alias", "add", "--file", "{exe_dir}/config/aliases/meal.toml", "--group", "root", "--canonical", "cli-refactor-leaf", "--alias", "cli-refactor-leaf"]
expect_exit = 0
expect_stdout_contains = ["Added alias `cli-refactor-leaf`"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::cli-refactor-leaf",
]

[[commands]]
name = "Alias Promote Uses Core Hierarchy Operation"
stage = "alias"
args = ["alias", "promote", "--file", "{exe_dir}/config/aliases/meal.toml", "--alias", "cli-refactor-leaf"]
expect_exit = 0
expect_stdout_contains = ["Promoted alias `cli-refactor-leaf`"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::[aliases.cli-refactor-leaf]",
  "{exe_dir}/config/aliases/meal.toml::group_aliases = [ 'cli-refactor-leaf' ]",
]

[[commands]]
name = "Alias Add Group Alias Uses Core Hierarchy Operation"
stage = "alias"
args = ["alias", "add-group-alias", "--file", "{exe_dir}/config/aliases/meal.toml", "--group", "cli-refactor-leaf", "--alias", "cli-refactor-group"]
expect_exit = 0
expect_stdout_contains = ["Updated group aliases"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::cli-refactor-group",
]

[[commands]]
name = "Alias Rename Group Alias Uses Core Hierarchy Operation"
stage = "alias"
args = ["alias", "rename-group-alias", "--file", "{exe_dir}/config/aliases/meal.toml", "--group", "cli-refactor-leaf", "--old-alias", "cli-refactor-group", "--alias", "cli-refactor-renamed"]
expect_exit = 0
expect_stdout_contains = ["Updated group aliases"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::cli-refactor-renamed",
]

[[commands]]
name = "Alias Move Config Uses Core Hierarchy Operation Without Migration"
stage = "alias"
args = ["alias", "move-config", "--file", "{exe_dir}/config/aliases/meal.toml", "--alias", "meal", "--to", "cli-refactor-leaf"]
expect_exit = 0
expect_stdout_contains = [
  "TXT files and database were not modified.",
  "Existing TXT using the old canonical may require migration.",
]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::[aliases.cli-refactor-leaf]",
  "{exe_dir}/config/aliases/meal.toml::dining = [ 'meal', '吃饭', '饭' ]",
]

[[commands]]
name = "Alias Rename Group Migrates From Core Replacements"
stage = "alias"
args = ["--db", "{db_path}", "alias", "rename-group", "--file", "{exe_dir}/config/aliases/meal.toml", "--group", "cli-refactor-leaf", "--name", "cli-refactor-renamed", "--input", "{exe_dir}/input/full"]
expect_exit = 0
expect_stdout_contains = ["Renamed group `cli-refactor-leaf` to `cli-refactor-renamed`; rebuilt database"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::[aliases.cli-refactor-renamed]",
]

[[commands]]
name = "Alias Add Migration Target"
stage = "alias"
args = ["alias", "add", "--file", "{exe_dir}/config/aliases/meal.toml", "--group", "root", "--canonical", "cli-migration-target", "--alias", "cli-migration-target"]
expect_exit = 0

[[commands]]
name = "Alias Promote Migration Target"
stage = "alias"
args = ["alias", "promote", "--file", "{exe_dir}/config/aliases/meal.toml", "--alias", "cli-migration-target"]
expect_exit = 0

[[commands]]
name = "Alias Move Migrates From Core Replacements"
stage = "alias"
args = ["--db", "{db_path}", "alias", "move", "--file", "{exe_dir}/config/aliases/meal.toml", "--alias", "meal", "--to", "cli-migration-target", "--input", "{exe_dir}/input/full"]
expect_exit = 0
expect_stdout_contains = ["Moved canonical leaf from `meal_cli-refactor-renamed_dining` to `meal_cli-migration-target_dining`; rebuilt database"]
expect_file_contains = [
  "{exe_dir}/config/aliases/meal.toml::[aliases.cli-migration-target]",
  "{exe_dir}/config/aliases/meal.toml::dining = [ 'meal', '吃饭', '饭' ]",
]

[[commands]]
name = "Alias Tree Uses Core Hierarchy Renderer"
stage = "alias"
args = ["alias", "tree", "--file", "{exe_dir}/config/aliases/meal.toml", "--show-aliases"]
expect_exit = 0
expect_stdout_contains = [
  "meal",
  "cli-migration-target",
  "dining — aliases: meal, 吃饭, 饭",
]
