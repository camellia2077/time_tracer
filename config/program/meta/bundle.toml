# Canonical source bundle for cross-platform config generation.
# Platform-specific bundles should be generated from this source.

schema_version = 1
profile = "shared"
bundle_name = "tracer_core_config"

[file_list]
required = [
  "program/config.toml",
  "program/charts/heatmap.toml",
  "program/charts/pie.toml",
  "program/insights/markdown/en/day.toml",
  "program/insights/markdown/en/month.toml",
  "program/insights/markdown/en/period.toml",
  "program/insights/markdown/en/week.toml",
  "program/insights/markdown/en/year.toml",
  "program/insights/markdown/zh/day.toml",
  "program/insights/markdown/zh/month.toml",
  "program/insights/markdown/zh/period.toml",
  "program/insights/markdown/zh/week.toml",
  "program/insights/markdown/zh/year.toml",
  "program/insights/markdown/ja/day.toml",
  "program/insights/markdown/ja/month.toml",
  "program/insights/markdown/ja/period.toml",
  "program/insights/markdown/ja/week.toml",
  "program/insights/markdown/ja/year.toml",
  "program/insights/latex/day.toml",
  "program/insights/latex/month.toml",
  "program/insights/latex/period.toml",
  "program/insights/latex/week.toml",
  "program/insights/latex/year.toml",
  "program/insights/typst/day.toml",
  "program/insights/typst/month.toml",
  "program/insights/typst/period.toml",
  "program/insights/typst/week.toml",
  "program/insights/typst/year.toml"
]
optional = [
  "program/insights/latex/common_style.toml",
  "program/insights/typst/common_style.toml"
]
