# config/config.toml

[system]
error_log = "../output/error_log.txt"
export_root = "exported_reports"
save_processed_output = true

[defaults]
db_path = "output/db/time_data.sqlite3"
output_root = "output"
default_format = "md"

[commands.export]
format = "md"

[commands.convert]
# 校验原始 TXT 结构与基础规则（年/月/日/事件格式、顺序、可识别活动等），确保可解析/可转换
validate_structure = true

# 校验转换后的业务逻辑（日期连续/完整性、活动时长>0且不超过16小时、每天活动数等）
validate_logic = true

save_processed_output = true

[commands.query]
format = "md"

[commands.ingest]
save_processed_output = true

[converter]
# Converter system config and main loader entry point.
main_config = "../user/behavior.toml"

[visualization]
heatmap = "charts/heatmap.toml"
pie = "charts/pie.toml"

[reports.typst]
root = "reports/typst"

[reports.latex]
root = "reports/latex"

[reports.markdown]
root = "reports/markdown"
default_locale = "en"
supported_locales = ["en", "zh", "ja"]
