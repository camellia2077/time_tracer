name: Windows CLI CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cli/windows/**'
      - 'libs/**'
      - 'apps/tracer_core_shell/**'
      - 'config/**'
      - 'test/**'
      - 'tools/run.py'
      - 'tools/test.py'
      - 'tools/toolchain/ci/**'
      - 'tools/toolchain/cli/**'
      - 'tools/toolchain/commands/cmd_build/**'
      - 'tools/toolchain/commands/cmd_quality/**'
      - 'tools/toolchain/config/**'
      - 'tools/toolchain/core/**'
      - 'tools/toolchain/services/**'
      - 'tools/suites/tracer_windows_rust_cli/**'
      - '.github/actions/**'
      - '.github/workflows/cli-ci.yml'
      - '.github/workflows/cli-verify-reusable.yml'
  pull_request:
    paths:
      - 'apps/cli/windows/**'
      - 'libs/**'
      - 'apps/tracer_core_shell/**'
      - 'config/**'
      - 'test/**'
      - 'tools/run.py'
      - 'tools/test.py'
      - 'tools/toolchain/ci/**'
      - 'tools/toolchain/cli/**'
      - 'tools/toolchain/commands/cmd_build/**'
      - 'tools/toolchain/commands/cmd_quality/**'
      - 'tools/toolchain/config/**'
      - 'tools/toolchain/core/**'
      - 'tools/toolchain/services/**'
      - 'tools/suites/tracer_windows_rust_cli/**'
      - '.github/actions/**'
      - '.github/workflows/cli-ci.yml'
      - '.github/workflows/cli-verify-reusable.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify-cli:
    uses: ./.github/workflows/cli-verify-reusable.yml
    with:
      job_prefix: cli
      artifact_prefix: cli-diagnostics
