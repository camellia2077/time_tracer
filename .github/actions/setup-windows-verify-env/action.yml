name: Setup Windows Verify Env
description: Prepare Python repo tools and the MSYS2 UCRT64 toolchain for Windows verify jobs.

inputs:
  msys2-update:
    description: Run a full MSYS2 package database and package update.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install repo tools package
      shell: pwsh
      run: |
        python -m pip install -e .

    - name: Setup MSYS2 UCRT64 Toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: ${{ inputs.msys2-update }}
        cache: true
        install: >-
          mingw-w64-ucrt-x86_64-clang
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ccache
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-nlohmann-json

    - name: Record MSYS2 package versions
      shell: pwsh
      run: |
        & 'C:\msys64\usr\bin\pacman.exe' -Q
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to list installed MSYS2 packages (exit code $LASTEXITCODE)."
        }

    - name: Add UCRT64 Bin To PATH
      shell: pwsh
      run: |
        "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
